<!DOCTYPE html>
<html>
<head>
    <title>Question 15 - includes()</title>
</head>
<body>
    <h2>Question 15: includes() - Check String</h2>

    <script>
        let text = "I am learning JavaScript";

        let result = text.includes("script");

        console.log(result);

        document.body.innerHTML += "<h3>Original String:</h3>";
        document.body.innerHTML += text;

        document.body.innerHTML += "<h3>Does the string contain 'script'?</h3>";
        document.body.innerHTML += result;
    </script>
</body>
</html>
