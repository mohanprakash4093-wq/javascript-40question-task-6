<!DOCTYPE html>
<html>
<head>
    <title>Question 2 - map()</title>
</head>
<body>
    <h2>Question 2: map() - Multiply Numbers by 5</h2>

    <script>
        let numbers = [2, 4, 6, 8, 10];

        let result = numbers.map(function(number) {
            return number * 5;
        });

        console.log(result);

        document.body.innerHTML += "<h3>Original Array:</h3>";
        document.body.innerHTML += numbers + "<br>";

        document.body.innerHTML += "<h3>After Multiplying by 5:</h3>";
        document.body.innerHTML += result.join(", ");
    </script>
</body>
</html>
