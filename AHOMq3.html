<!DOCTYPE html>
<html>
<head>
    <title>Question 3 - filter()</title>
</head>
<body>
    <h2>Question 3: filter() - Numbers Greater Than 20</h2>

    <script>
        let numbers = [10, 15, 20, 25, 30, 35, 40, 45];

        let result = numbers.filter(function(number) {
            return number > 20;
        });

        console.log(result);

        document.body.innerHTML += "<h3>Original Array:</h3>";
        document.body.innerHTML += numbers.join(", ");

        document.body.innerHTML += "<h3>Numbers Greater Than 20:</h3>";
        document.body.innerHTML += result.join(", ");
    </script>
</body>
</html>
