<!DOCTYPE html>
<html>
<head>
    <title>Question 21 - Date Methods</title>
</head>
<body>
    <h2>JavaScript Date Methods</h2>

    <script>
        let today = new Date();

        let year = today.getFullYear();
        let month = today.getMonth() + 1;
        let date = today.getDate();

        let days = [
            "Sunday",
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday"
        ];

        let day = days[today.getDay()];

        document.body.innerHTML += "<p>Current Year: " + year + "</p>";
        document.body.innerHTML += "<p>Current Month: " + month + "</p>";
        document.body.innerHTML += "<p>Current Date: " + date + "</p>";
        document.body.innerHTML += "<p>Current Day: " + day + "</p>";
    </script>
</body>
</html>
