<!DOCTYPE html>
<html>
<head>
    <title>Question 5 - find()</title>
</head>
<body>
    <h2>Question 5: find() - First Employee Salary Above ₹200,000</h2>

    <script>
        let employees = [
            { name: "Arun", salary: 250000 },
            { name: "Priya", salary: 350000 },
            { name: "Karthik", salary: 300000 },
            { name: "Divya", salary: 200000 },
            { name: "Ravi", salary: 400000 }
        ];

        let result = employees.find(function(employee) {
            return employee.salary > 200000;
        });

        console.log(result);

        document.body.innerHTML += "<h3>First matching employee:</h3>";

        if (result) {
            document.body.innerHTML +=
                "Name: " + result.name + "<br>" +
                "Salary: ₹" + result.salary;
        } else {
            document.body.innerHTML += "No matching employee found.";
        }
    </script>
</body>
</html>
