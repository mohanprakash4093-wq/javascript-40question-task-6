<!DOCTYPE html>
<html>
<head>
    <title>Question 26 - setInterval()</title>
</head>
<body>
    <h2>JavaScript setInterval() Method</h2>

    <p id="output">Waiting for the first message...</p>

    <script>
        setInterval(function() {
            document.getElementById("output").innerHTML +=
                "<br>Learning JavaScript";

            console.log("Learning JavaScript");
        }, 2000);
    </script>
</body>
</html>
