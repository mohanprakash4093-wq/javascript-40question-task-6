<!DOCTYPE html>
<html>
<head>
    <title>Question 16 - startsWith() and endsWith()</title>
</head>
<body>
    <h2>Question 16: startsWith() and endsWith()</h2>

    <script>
        let text = "JavaScript";

        let startResult = text.startsWith("Java");
        let endResult = text.endsWith("Script");

        console.log(startResult);
        console.log(endResult);

        document.body.innerHTML += "<h3>Original String:</h3>";
        document.body.innerHTML += text;

        document.body.innerHTML += "<h3>Does the string start with 'Java'?</h3>";
        document.body.innerHTML += startResult;

        document.body.innerHTML += "<h3>Does the string end with 'Script'?</h3>";
        document.body.innerHTML += endResult;
    </script>
</body>
</html>
