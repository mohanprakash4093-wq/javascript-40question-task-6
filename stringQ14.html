<!DOCTYPE html>
<html>
<head>
    <title>Question 14 - Uppercase and Lowercase</title>
</head>
<body>
    <h2>Question 14: toUpperCase() and toLowerCase()</h2>

    <script>
        let text = "Welcome to JavaScript";

        let upperCaseText = text.toUpperCase();
        let lowerCaseText = text.toLowerCase();

        console.log(upperCaseText);
        console.log(lowerCaseText);

        document.body.innerHTML += "<h3>Original String:</h3>";
        document.body.innerHTML += text;

        document.body.innerHTML += "<h3>Uppercase String:</h3>";
        document.body.innerHTML += upperCaseText;

        document.body.innerHTML += "<h3>Lowercase String:</h3>";
        document.body.innerHTML += lowerCaseText;
    </script>
</body>
</html>
