<!DOCTYPE html>
<html>
<head>
    <title>Question 13 - trim()</title>
</head>
<body>
    <h2>Question 13: trim() - Remove Extra Spaces</h2>

    <script>
        let text = "   Welcome to JavaScript   ";

        let result = text.trim();

        console.log(result);

        document.body.innerHTML += "<h3>Original String:</h3>";
        document.body.innerHTML += "[" + text + "]";

        document.body.innerHTML += "<h3>String After trim():</h3>";
        document.body.innerHTML += "[" + result + "]";
    </script>
</body>
</html>
