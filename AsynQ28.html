<!DOCTYPE html>
<html>
<head>
    <title>Question 28 - Execution Order</title>
</head>
<body>
    <h2>JavaScript Execution Order</h2>

    <script>
        function one() {
            document.body.innerHTML += "One<br>";
            console.log("One");
        }

        function two() {
            document.body.innerHTML += "Two<br>";
            console.log("Two");
        }

        function three() {
            document.body.innerHTML += "Three<br>";
            console.log("Three");
        }

        one();

        setTimeout(two, 0);

        three();
    </script>
</body>
</html>
