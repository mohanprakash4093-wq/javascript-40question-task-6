<!DOCTYPE html>
<html>
<head>
    <title>Question 19 - join()</title>
</head>
<body>
    <h2>JavaScript Array join() Method</h2>

    <script>
        let names = ["Arun", "Priya", "Karthik", "Divya", "Ravi"];

        let result = names.join(", ");

        document.body.innerHTML += "<p>Original Array: " + names + "</p>";
        document.body.innerHTML += "<p>Joined String: " + result + "</p>";

        console.log(result);
    </script>
</body>
</html>
