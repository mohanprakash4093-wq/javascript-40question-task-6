<!DOCTYPE html>
<html>
<head>
    <title>Question 17 - replaceAll()</title>
</head>
<body>
    <h2>JavaScript String replaceAll() Method</h2>

    <script>
        let text = "java is popular. java is powerful. java is fun.";

        let result = text.replaceAll("java", "python");

        document.body.innerHTML += "<p>Original String: " + text + "</p>";
        document.body.innerHTML += "<p>After replaceAll(): " + result + "</p>";

        console.log(result);
    </script>
</body>
</html>
