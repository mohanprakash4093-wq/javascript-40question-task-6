<!DOCTYPE html>
<html>
<head>
    <title>Question 18 - split()</title>
</head>
<body>
    <h2>JavaScript String split() Method</h2>

    <script>
        let text = "html-css-javascript-react";

        let result = text.split("-");

        document.body.innerHTML += "<p>Original String: " + text + "</p>";
        document.body.innerHTML += "<p>Split Array: " + result + "</p>";

        console.log(result);
    </script>
</body>
</html>
