<!DOCTYPE html>
<html>
<head>
    <title>Question 11 - charAt()</title>
</head>
<body>
    <h2>Question 11: charAt() - Character at Index 4</h2>

    <script>
        let text = "javascript";

        let result = text.charAt(4);

        console.log(result);

        document.body.innerHTML += "<h3>Original String:</h3>";
        document.body.innerHTML += text;

        document.body.innerHTML += "<h3>Character at Index 4:</h3>";
        document.body.innerHTML += result;
    </script>
</body>
</html>
