<!DOCTYPE html>
<html>
<head>
    <title>Question 20 - slice()</title>
</head>
<body>
    <h2>JavaScript String slice() Method</h2>

    <script>
        let text = "JavaScript Programming";

        let result = text.slice(0, 10);

        document.body.innerHTML += "<p>Original String: " + text + "</p>";
        document.body.innerHTML += "<p>Sliced String: " + result + "</p>";

        console.log(result);
    </script>
</body>
</html>
