<!DOCTYPE html>
<html>
<head>
    <title>Question 25 - setTimeout()</title>
</head>
<body>
    <h2>JavaScript setTimeout() Method</h2>

    <p id="output">Please wait 3 seconds...</p>

    <script>
        setTimeout(function() {
            document.getElementById("output").innerHTML =
                "Welcome to JavaScript";

            console.log("Welcome to JavaScript");
        }, 3000);
    </script>
</body>
</html>
