<!DOCTYPE html>
<html>
<head>
    <title>Question 12 - charCodeAt()</title>
</head>
<body>
    <h2>Question 12: charCodeAt() - Character Code at Index 2</h2>

    <script>
        let text = "javascript";

        let result = text.charCodeAt(2);

        console.log(result);

        document.body.innerHTML += "<h3>Original String:</h3>";
        document.body.innerHTML += text;

        document.body.innerHTML += "<h3>Character at Index 2:</h3>";
        document.body.innerHTML += text.charAt(2);

        document.body.innerHTML += "<h3>Character Code at Index 2:</h3>";
        document.body.innerHTML += result;
    </script>
</body>
</html>
