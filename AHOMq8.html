<!DOCTYPE html>
<html>
<head>
    <title>Question 8 - every()</title>
</head>
<body>
    <h2>Question 8: every() - Check Positive Numbers</h2>

    <script>
        let numbers = [10, 20, 30, 40, 50];

        let result = numbers.every(function(number) {
            return number > 0;
        });

        console.log(result);

        document.body.innerHTML += "<h3>Original Array:</h3>";
        document.body.innerHTML += numbers.join(", ");

        document.body.innerHTML += "<h3>Are all numbers greater than zero?</h3>";
        document.body.innerHTML += result;
    </script>
</body>
</html>
